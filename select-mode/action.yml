name: ProConnect release - Select mode
description: Whether to version or publish in the current repo state.
author: ProConnect

outputs:
  mode:
    description: "'version' (open the release PR), 'publish' (tag and release) or 'none'."
    value: ${{ steps.release.outputs.mode }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - run: bun install --frozen-lockfile --production
      shell: bash
      working-directory: ${{ github.action_path }}/..
    - id: release
      run: bun "$GITHUB_ACTION_PATH/../src/main.ts" select-mode
      shell: bash
