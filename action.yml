name: ProConnect release
description: Open a signed release PR with a gitmoji changelog, then tag and publish the GitHub release once it merges.
author: ProConnect

inputs:
  dry-run:
    default: "false"
    description: Prepare writes files and prints the diff without opening a PR; Publish logs the version it would tag.
  github-token:
    default: ${{ github.token }}
    description: Token used to push the tag, create the GitHub release and open the release PR.

outputs:
  published:
    description: '"true" when a version was tagged and released.'
    value: ${{ steps.release.outputs.published }}
  version:
    description: Version prepared or published.
    value: ${{ steps.release.outputs.version }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - run: bun install --frozen-lockfile --production
      shell: bash
      working-directory: ${{ github.action_path }}
    - id: release
      run: bun "$GITHUB_ACTION_PATH/src/main.ts"
      shell: bash
      env:
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    - if: steps.release.outputs.mode == 'prepare' && inputs.dry-run != 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        body-path: ${{ steps.release.outputs.body_path }}
        branch: release-it/next
        commit-message: 🔖 release ${{ steps.release.outputs.version }}
        sign-commits: true
        title: 🔖 release ${{ steps.release.outputs.version }}
        token: ${{ inputs.github-token }}
