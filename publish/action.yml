name: ProConnect release - Publish
description: Tag the merged package.json version and create the GitHub release from its CHANGELOG.md section.
author: ProConnect

inputs:
  dry-run:
    default: "false"
    description: Log the version that would be tagged, create nothing.
  github-token:
    default: ${{ github.token }}
    description: Token used to push the tag and create the GitHub release.

outputs:
  published:
    description: '"true" when the version was tagged and released.'
    value: ${{ steps.release.outputs.published }}
  version:
    description: Version published.
    value: ${{ steps.release.outputs.version }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - run: bun install --frozen-lockfile --production
      shell: bash
      working-directory: ${{ github.action_path }}/..
    - id: release
      run: bun "$GITHUB_ACTION_PATH/../src/main.ts" publish
      shell: bash
      env:
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
