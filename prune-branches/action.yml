name: ProConnect release - Prune branches
description: Delete release/* branches older than six months whose tip is tagged, keeping the five most recent.
author: ProConnect

inputs:
  dry-run:
    default: "false"
    description: List the branches that would be deleted, delete nothing.
  github-token:
    default: ${{ github.token }}
    description: Token used to delete the branches.

outputs:
  branches:
    description: Comma-separated release branches deleted (or that would be, in dry-run).
    value: ${{ steps.release.outputs.branches }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - run: bun install --frozen-lockfile --production
      shell: bash
      working-directory: ${{ github.action_path }}/..
    - id: release
      run: bun "$GITHUB_ACTION_PATH/../src/main.ts" prune-branches
      shell: bash
      env:
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
