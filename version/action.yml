name: ProConnect release - Version
description: Bump the version, write the changelog and open the signed release PR.
author: ProConnect

inputs:
  dry-run:
    default: "false"
    description: Write the files and print the diff, no PR.
  github-token:
    default: ${{ github.token }}
    description: Token used to open the release PR.

outputs:
  pr-number:
    description: The release PR number created or updated.
    value: ${{ steps.pull-request.outputs.pull-request-number }}
  version:
    description: Version in the release PR.
    value: ${{ steps.release.outputs.version }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - run: bun install --frozen-lockfile --production
      shell: bash
      working-directory: ${{ github.action_path }}/..
    - id: release
      run: bun "$GITHUB_ACTION_PATH/../src/main.ts" version
      shell: bash
      env:
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
    - id: pull-request
      if: inputs.dry-run != 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        body-path: ${{ steps.release.outputs.body_path }}
        branch: release-it/next
        commit-message: 🔖 release ${{ steps.release.outputs.version }}
        sign-commits: true
        title: 🔖 release ${{ steps.release.outputs.version }}
        token: ${{ inputs.github-token }}
